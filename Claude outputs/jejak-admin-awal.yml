# Membuat akun admin pertama, atau memulihkan akun admin, di lingkungan uji (spesifikasi JS-04, P-28 sampai P-30).
# Email dan sandi sementara dibaca dari rahasia GitHub JEJAK_ADMIN_EMAIL dan JEJAK_ADMIN_SANDI_SEMENTARA, dan isinya
# tidak pernah dicetak. Kunci sekali pakai KUNCI_ADMIN dibuat setiap kali dijalankan, lalu selalu diganti nilai acak baru
# yang tidak disimpan di mana pun, sehingga rute admin awal kembali tertutup. Setiap `secret put` membuat versi Worker
# baru, jadi satu kali menjalankan alur kerja ini membuat dua versi.
name: "Jejak: admin awal"

on:
  workflow_dispatch:
    inputs:
      nama_tampilan:
        description: "Nama tampilan admin (1–40 karakter)"
        required: true
        default: "Admin"

permissions:
  contents: read

concurrency:
  group: jejak-cloudflare-uji
  cancel-in-progress: false

jobs:
  admin-awal:
    name: Buat atau pulihkan akun admin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      JEJAK_ADMIN_EMAIL: ${{ secrets.JEJAK_ADMIN_EMAIL }}
      JEJAK_ADMIN_SANDI_SEMENTARA: ${{ secrets.JEJAK_ADMIN_SANDI_SEMENTARA }}
      NAMA_TAMPILAN: ${{ inputs.nama_tampilan }}
      WRANGLER_SEND_METRICS: "false"
      ALAMAT_TETAP: ${{ vars.JEJAK_ALAMAT_UJI }}
    steps:
      # Aturan sama dengan server (P-19 dan P-27): email dipangkas dan berhuruf kecil, paling panjang 254 karakter;
      # sandi 12 sampai 128 titik kode sesudah NFC; nama 1 sampai 40 titik kode tanpa karakter kendali.
      - name: Periksa rahasia dan masukan
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Rahasia Cloudflare belum diisi (Architecture bagian 18, langkah 6).'
            exit 1
          fi
          if [ -z "$JEJAK_ADMIN_EMAIL" ] || [ -z "$JEJAK_ADMIN_SANDI_SEMENTARA" ]; then
            echo '::error::Rahasia JEJAK_ADMIN_EMAIL atau JEJAK_ADMIN_SANDI_SEMENTARA belum diisi (Architecture bagian 18, langkah 6).'
            exit 1
          fi
          python3 - <<'PY'
          import os, re, sys, unicodedata
          email = os.environ["JEJAK_ADMIN_EMAIL"].strip().lower()
          sandi = unicodedata.normalize("NFC", os.environ["JEJAK_ADMIN_SANDI_SEMENTARA"])
          nama = os.environ["NAMA_TAMPILAN"].strip()
          galat = None
          if len(email) > 254 or not re.fullmatch(r"[^\s@]+@[^\s@]+\.[^\s@]+", email):
              galat = "JEJAK_ADMIN_EMAIL bukan alamat email."
          elif not 12 <= len(sandi) <= 128:
              galat = "JEJAK_ADMIN_SANDI_SEMENTARA harus 12 sampai 128 karakter. Isi ulang rahasianya, lalu jalankan lagi."
          elif not 1 <= len(nama) <= 40 or re.search(r"[\x00-\x1f\x7f-\x9f]", nama):
              galat = "Nama tampilan harus 1 sampai 40 karakter."
          if galat:
              print("::error::" + galat)
              sys.exit(1)
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Simpan kunci sekali pakai
        id: kunci
        run: |
          KUNCI=$(openssl rand -hex 32)
          echo "::add-mask::$KUNCI"
          echo "KUNCI=$KUNCI" >> "$GITHUB_ENV"
          printf '%s' "$KUNCI" | npx -y wrangler@4.92.0 secret put KUNCI_ADMIN --name jejak-setara-uji

      - name: Cari alamat lingkungan uji
        run: |
          if [ -n "$ALAMAT_TETAP" ]; then
            ALAMAT="$ALAMAT_TETAP"
          else
            SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            ALAMAT="https://jejak-setara-uji.$SUB.workers.dev"
          fi
          echo "ALAMAT=$ALAMAT" >> "$GITHUB_ENV"

      # 200: selesai. 400, dan 503 KONSOL_BELUM_SIAP: berhenti dengan pesan. Lainnya (misalnya 403 atau 404 selama versi
      # Worker dengan kunci baru belum aktif) diulang paling banyak 10 kali dengan jeda 3 detik.
      - name: Buat atau pulihkan akun
        run: |
          ISI="$RUNNER_TEMP/admin-awal.json"
          JAWABAN="$RUNNER_TEMP/admin-awal-jawaban.json"
          trap 'rm -f "$ISI" "$JAWABAN"' EXIT
          umask 077
          jq -n '{email: env.JEJAK_ADMIN_EMAIL, sandi: env.JEJAK_ADMIN_SANDI_SEMENTARA, namaTampilan: env.NAMA_TAMPILAN}' > "$ISI"
          chmod 600 "$ISI"
          STATUS=0
          for i in $(seq 1 10); do
            STATUS=$(curl -sS -o "$JAWABAN" -w '%{http_code}' -X POST "$ALAMAT/api/admin-awal" -H "X-Jejak-Kunci-Admin: $KUNCI" -H "Content-Type: application/json" --data-binary "@$ISI" || true)
            if [ "$STATUS" = "200" ]; then break; fi
            KODE=$(jq -r '.galat.kode // ""' "$JAWABAN" 2>/dev/null || true)
            if [ "$STATUS" = "400" ]; then
              case "$KODE" in
                EMAIL_SALAH) echo '::error::JEJAK_ADMIN_EMAIL bukan alamat email.' ;;
                SANDI_PENDEK | SANDI_PANJANG) echo '::error::JEJAK_ADMIN_SANDI_SEMENTARA harus 12 sampai 128 karakter. Isi ulang rahasianya, lalu jalankan lagi.' ;;
                NAMA_SALAH) echo '::error::Nama tampilan harus 1 sampai 40 karakter.' ;;
                *) echo "::error::Akun admin gagal dibuat (status $STATUS)." ;;
              esac
              exit 1
            fi
            if [ "$STATUS" = "503" ] && [ "$KODE" = "KONSOL_BELUM_SIAP" ]; then
              echo '::error::Konsol belum siap: kunci Worker belum dibuat. Jalankan ulang "Jejak: uji", lalu coba lagi.'
              exit 1
            fi
            sleep 3
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::Akun admin gagal dibuat (status $STATUS)."
            exit 1
          fi
          HASIL=$(jq -r '.hasil' "$JAWABAN")
          {
            if [ "$HASIL" = "dipulihkan" ]; then
              echo 'Akun admin dipulihkan: sandi sementara baru berlaku, dan semua sesi lama sudah keluar.'
            else
              echo 'Akun admin dibuat.'
            fi
            echo
            echo "Alamat konsol: $ALAMAT/admin/"
            echo
            echo 'Masuk dengan email di rahasia JEJAK_ADMIN_EMAIL dan sandi sementara di rahasia JEJAK_ADMIN_SANDI_SEMENTARA, lalu buat sandi baru.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Selalu dijalankan sesudah kunci disimpan, juga bila langkah sebelumnya gagal: kunci diganti nilai acak baru yang
      # tidak dicetak dan tidak disimpan, sehingga rute admin awal menjawab 403 lagi.
      - name: Tutup kembali rute admin awal
        if: always() && steps.kunci.outcome != 'skipped'
        run: openssl rand -hex 32 | tr -d '\n' | npx -y wrangler@4.92.0 secret put KUNCI_ADMIN --name jejak-setara-uji
