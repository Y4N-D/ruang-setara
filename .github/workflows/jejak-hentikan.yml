# Alur kerja darurat Jejak Setara (spesifikasi JS-22, P-11 sampai P-14). "hentikan" menyimpan rahasia Worker DARURAT
# bernilai 1, sehingga Worker menjawab 503 untuk semua API dan sambungan, dan setiap ruang yang bangun menutup dirinya;
# "pulihkan" menghapus rahasia itu. Deploy biasa tidak menyentuh rahasia ini. Tidak ada nilai rahasia yang dicetak.
# Pilihan produksi ditambahkan di JS-15.
name: "Jejak: hentikan"

on:
  workflow_dispatch:
    inputs:
      aksi:
        description: "hentikan atau pulihkan"
        type: choice
        options:
          - hentikan
          - pulihkan
        required: true
      lingkungan:
        description: "Lingkungan"
        type: choice
        options:
          - uji
        default: uji
        required: true

permissions:
  contents: read

concurrency:
  group: jejak-cloudflare-uji
  cancel-in-progress: false

jobs:
  ubah:
    name: Ubah layanan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AKSI: ${{ inputs.aksi }}
      LINGKUNGAN: ${{ inputs.lingkungan }}
      WRANGLER_SEND_METRICS: "false"
      ALAMAT_TETAP: ${{ vars.JEJAK_ALAMAT_UJI }}
    steps:
      - name: Periksa rahasia
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Rahasia Cloudflare belum diisi (Architecture bagian 18, langkah 6).'
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Ubah rahasia DARURAT
        run: |
          set -euo pipefail
          if [ "$AKSI" = "hentikan" ]; then
            printf '1' | npx -y wrangler@4.92.0 secret put DARURAT --name "jejak-setara-$LINGKUNGAN" > /dev/null
          else
            printf 'y\n' | npx -y wrangler@4.92.0 secret delete DARURAT --name "jejak-setara-$LINGKUNGAN" > /dev/null || echo "Rahasia DARURAT sudah tidak ada."
          fi

      - name: Periksa
        run: |
          set -euo pipefail
          if [ -n "$ALAMAT_TETAP" ]; then
            ALAMAT="$ALAMAT_TETAP"
          else
            SUB=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
            ALAMAT="https://jejak-setara-$LINGKUNGAN.$SUB.workers.dev"
          fi
          if [ "$AKSI" = "hentikan" ]; then HARAP=true; else HARAP=false; fi
          for i in $(seq 1 24); do
            DARURAT=$(curl -fsS "$ALAMAT/api/sehat" 2>/dev/null | jq -r '.darurat // false' 2>/dev/null || echo galat)
            if [ "$DARURAT" = "$HARAP" ]; then
              if [ "$AKSI" = "hentikan" ]; then
                echo "Layanan uji dihentikan." >> "$GITHUB_STEP_SUMMARY"
              else
                echo "Layanan uji dipulihkan." >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 0
            fi
            sleep 5
          done
          echo 'Pemeriksaan sesudah perubahan tidak cocok. Lihat log langkah "Periksa".' >> "$GITHUB_STEP_SUMMARY"
          echo '::error::Pemeriksaan sesudah perubahan tidak cocok.'
          exit 1
